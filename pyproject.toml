[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphastrategy"
version = "0.1.0"
description = "Local Alpaca paper execution desk for alphaloop strategy bundles (.asb)."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AlphaStrategy Team"},
]
keywords = ["quant", "trading", "paper-trading", "execution", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
alphastrategy = "alphastrategy.cli.main:main"

[project.urls]
Homepage = "https://github.com/AlphaStrategyAI/alphastrategy"
Documentation = "https://github.com/AlphaStrategyAI/alphastrategy#readme"
Repository = "https://github.com/AlphaStrategyAI/alphastrategy"
Issues = "https://github.com/AlphaStrategyAI/alphastrategy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/alphastrategy"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I", "N", "W"]
lint.ignore = ["E501", "F401", "F811"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
